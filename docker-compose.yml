services:
  db:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433 (not 5432) to avoid conflict with a local PostgreSQL
      # service that may already occupy port 5432 on the host machine.
      # Inside the Docker network, other services still reach this DB at db:5432.
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=5"
      - "-c"
      - "max_wal_senders=5"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=backend_db;Username=postgres;Password=postgres"
      Jwt__Key: "${JWT_KEY}"
      Neo4jSettings__Uri: bolt://neo4j:7687
      Neo4jSettings__User: neo4j
      Neo4jSettings__Password: starslab!
    ports:
      - "5100:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # =========================================================================
  # CDC & Graph Infrastructure
  # =========================================================================

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/starslab!
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_dbms_default__listen__address: 0.0.0.0
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p starslab! 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: stars-cdc-cluster-001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  debezium:
    image: quay.io/debezium/connect:latest
    container_name: debezium
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: stars-cdc-connect
      CONFIG_STORAGE_TOPIC: stars-connect-configs
      OFFSET_STORAGE_TOPIC: stars-connect-offsets
      STATUS_STORAGE_TOPIC: stars-connect-statuses
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stars
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  cdc-processor:
    build:
      context: ./cdc-processor
      dockerfile: Dockerfile
    container_name: cdc-processor
    restart: unless-stopped
    environment:
      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: stars-cdc-processor-v6
      Kafka__Topics:0: stars.public.Users
      Kafka__Topics:1: stars.public.Tasks
      Kafka__Topics:2: stars.public.TaskAssignments
      Kafka__Topics:3: stars.public.Recommendations
      Kafka__Topics:4: stars.public.Departments
      Neo4j__Uri: bolt://neo4j:7687
      Neo4j__User: neo4j
      Neo4j__Password: starslab!
      CdcProcessor__SyncIntervalMinutes: 10
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: stars@admin.com
      PGADMIN_DEFAULT_PASSWORD: starslab!
    depends_on:
      db:
        condition: service_healthy

  # =========================================================================
  # Stream Analytics Infrastructure
  # =========================================================================

  ksqldb:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: ksqldb
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: stars-ksql
      KSQL_KSQL_QUERIES_FILE: /etc/ksql/queries.sql
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
    volumes:
      - ./ksql-queries.sql:/etc/ksql/queries.sql
    depends_on:
      kafka:
        condition: service_healthy

  ksqldb-cli:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: ksqldb-cli
    restart: "no"
    depends_on:
      - ksqldb
    entrypoint: /bin/sh
    tty: true

volumes:
  pgdata:
  kafka-data:
  neo4j-data: